[project]
name = "kasp"
version = "0.1.0"
description = "Console tool for checking product versions against known vulnerabilities"
authors = [
    { name = "Shoma", email = "g.artem1902@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.2",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
kasp = "kasp.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
